name: Rebuild Listing Pages

# Static /projects/ and /links/ pages (scripts/build-listings.js) go stale when their
# JSON, the icon maps or categories in app.js, or the ?v= params in index.html change.
# add-project.yml and add-link.yml rebuild inline, because their GITHUB_TOKEN pushes
# do not trigger this workflow.
on:
  push:
    paths:
      - 'projects/projects.json'
      - 'links/links.json'
      - 'app.js'
      - 'index.html'
      - 'scripts/build-listings.js'
      - 'scripts/lib/**'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rebuild-listing-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build listing pages
        run: node scripts/build-listings.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/index.html links/index.html
          git diff --staged --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "chore: rebuild static listing pages"
          git push
